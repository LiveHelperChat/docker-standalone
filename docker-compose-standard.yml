services:
    web:
        image: nginx:latest
        ulimits:
          nofile:
            soft: 65535
            hard: 65535
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"
        env_file: .env
        ports:
            - "${LHC_PUBLIC_PORT}:80"
        volumes:
            - ./livehelperchat/lhc_web:/code
            - ./conf/nginx/site.conf:/etc/nginx/conf.d/default.conf
            - ./conf/nginx/mime.types:/etc/nginx/mime.types
            - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - db
            - php
        networks:
            - code-network
        restart: always
    php:
        build:
            context: ./Dockerfiles/php
            target: runtime
        image: remdex/livehelperchat-php:latest
        ulimits:
          nofile:
            soft: 65535
            hard: 65535
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"
        env_file: .env
        volumes:
            - ./livehelperchat/lhc_web:/code
            - ./lhc-php-resque/lhcphpresque:/code/extension/lhcphpresque
            - ./conf/scripts:/scripts
            - ./conf/php-fpm/zz-lhc.conf:/usr/local/etc/php-fpm.d/zz-lhc.conf
        networks:
            - code-network
        restart: always
    php-cronjob:
        build:
            context: ./Dockerfiles/php
            target: cronjob
        image: remdex/livehelperchat-php-cronjob:latest
        ulimits:
          nofile:
            soft: 65535
            hard: 65535
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"
        env_file: .env
        volumes:
            - ./livehelperchat/lhc_web:/code
            - ./lhc-php-resque/lhcphpresque:/code/extension/lhcphpresque
            - ./conf/scripts:/scripts
            - ./conf/php/cronjob.ini:/usr/local/etc/php/conf.d/zz-lhc.ini
            # live crontab - edit on the host, then `docker compose up -d` / restart the container
            - ./Dockerfiles/php/cron/cronjob:/etc/cron.d:ro
        networks:
            - code-network
        restart: always
    cobrowse:
        build: ./Dockerfiles/cobrowse
        image: remdex/livehelperchat-cobrowse:latest
        ulimits:
          nofile:
            soft: 65535
            hard: 65535
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"
        ports:
          - 127.0.0.1:31130:31130
        networks:
            - code-network
        restart: always
    php-resque:
        build:
            context: ./Dockerfiles/php
            target: resque
        image: remdex/livehelperchat-php-resque:latest
        ulimits:
          nofile:
            soft: 65535
            hard: 65535
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"
        env_file: .env
        volumes:
            - ./livehelperchat/lhc_web:/code
            - ./lhc-php-resque/lhcphpresque:/code/extension/lhcphpresque
            - ./conf/scripts:/scripts
            - ./.env:/scripts/.env:ro
            - ./conf/php/resque.ini:/usr/local/etc/php/conf.d/zz-lhc.ini
            # live crontab - edit on the host, then `docker compose up -d` / restart the container
            - ./Dockerfiles/php/cron/resque:/etc/cron.d:ro
        networks:
            - code-network
        restart: always
        depends_on:
          - db
          - redis
    redis:
        image: "redis:alpine"
        ulimits:
          nofile:
            soft: 65535
            hard: 65535
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"
        # PHP sessions live in Redis (conf/php-fpm/zz-lhc.conf sets
        # session.save_handler=redis), so without a persistent ./data every session is
        # lost when this container is recreated. Stored on the host in ./redisdata,
        # next to ./dbdata. Append-only file keeps at most one fsync window of writes.
        # REDIS_APPEND_FSYNC: everysec (Redis default) | always | no - see .env.default.
        command:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "${REDIS_APPEND_FSYNC:-everysec}"
            # Upstream default is 0 = refuse to start on a corrupt AOF tail, so one
            # unclean shutdown (SIGKILL, power loss, full disk) becomes a crash loop.
            # 128 MiB in BYTES (the option takes no unit suffix) truncates the torn
            # tail at startup and loses only those commands.
            - "--aof-load-corrupt-tail-max-size"
            - "${REDIS_AOF_CORRUPT_TAIL_MAX:-134217728}"
        # docker stop sends SIGTERM and Redis fsyncs + exits; the default 10s can
        # expire first and SIGKILL it mid-write, which is what corrupts the AOF.
        stop_grace_period: 1m
        volumes:
            - ./redisdata:/data
        networks:
          - code-network
        restart: always
    db:
      image: mariadb
      ulimits:
        nofile:
          soft: 65535
          hard: 65535
      logging:
        driver: json-file
        options:
          max-size: "50m"
          max-file: "5"
      env_file: .env
      environment:
        TZ: UTC
      volumes:
        - ./dbdata:/var/lib/mysql
      ports:
        - 127.0.0.1:3307:3306
      command:
        - "--innodb-buffer-pool-size=256M"
      networks:
        - code-network
      restart: always
networks:
    code-network:
        driver: bridge
