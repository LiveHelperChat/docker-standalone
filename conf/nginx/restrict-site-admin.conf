# Site Admin Access Control
# =============================================================================
geo $site_admin_ip_allowed {
    default 0;
    192.168.1.2 1;
}

map $uri $site_admin_request {
    default 0;
    ~*site_admin 1;
}

map "$site_admin_request:$site_admin_ip_allowed" $deny_site_admin {
    default 0;
    "1:0" 1;
}

# =============================================================================

server {
    # .......
    # Deny only unallowlisted requests whose path contains site_admin.
    if ($deny_site_admin) {
        return 403;
    }
    # .......
}